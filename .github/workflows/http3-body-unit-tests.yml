name: HTTP/3 Body Unit Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'auto/**'
      - 'tests/unit/**'
      - '.github/workflows/http3-body-unit-tests.yml'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'auto/**'
      - 'tests/unit/**'
      - '.github/workflows/http3-body-unit-tests.yml'

permissions:
  contents: read

jobs:
  http3-body-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libssl-dev

      - name: Configure HTTP/3
        run: |
          sh auto/configure --with-http_v3_module \
              --without-http_rewrite_module --without-http_gzip_module

      - name: Run unit tests
        run: make -C tests/unit check

      - name: Run unit tests with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make -C tests/unit clean
          make -C tests/unit check CC=clang \
              CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' \
              LDFLAGS='-fsanitize=address,undefined'
